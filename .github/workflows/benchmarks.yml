name: Benchmarks

on:
  workflow_dispatch:
    inputs:
      baseline_ref:
        description: Optional Golyglot ref; blank skips revision comparison
        required: false
        default: ""
        type: string
      runner:
        description: GitHub-hosted or larger-runner label
        required: true
        default: ubuntu-24.04
        type: string
      fail_regression_percent:
        description: Optional median regression threshold; zero only reports
        required: true
        default: "0"
        type: string
      run_polyglot_core:
        description: Build and compare the fully optimized Polyglot core
        required: true
        default: true
        type: boolean
      core_samples:
        description: Paired samples per optimized core benchmark
        required: true
        default: 10
        type: number
      core_duration_ms:
        description: Timed duration of each core sample in milliseconds
        required: true
        default: 1000
        type: number

permissions:
  contents: read

concurrency:
  group: benchmarks-${{ github.ref }}
  cancel-in-progress: false

jobs:
  go-benchmarks:
    name: Go revision comparison
    if: ${{ inputs.baseline_ref != '' }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: 1.25.12
          cache: true
      - name: Resolve distinct baseline
        env:
          BASELINE_REF: ${{ inputs.baseline_ref }}
        run: |
          set -euo pipefail
          if baseline_commit=$(git rev-parse --verify "${BASELINE_REF}^{commit}" 2>/dev/null); then
            :
          else
            git fetch --no-tags origin "$BASELINE_REF"
            baseline_commit=$(git rev-parse FETCH_HEAD)
          fi
          if [[ "$baseline_commit" == "$GITHUB_SHA" ]]; then
            echo "::error::baseline_ref and current ref both resolve to $GITHUB_SHA"
            exit 1
          fi
          echo "BASELINE_COMMIT=$baseline_commit" >> "$GITHUB_ENV"
          git worktree add --detach "$RUNNER_TEMP/golyglot-baseline" "$baseline_commit"
      - name: Compile benchmark binaries
        run: |
          set -euo pipefail
          CGO_ENABLED=0 go test -c -trimpath -o "$RUNNER_TEMP/current-bench.test" ./benchmarks
          (
            cd "$RUNNER_TEMP/golyglot-baseline"
            CGO_ENABLED=0 go test -c -trimpath -o "$RUNNER_TEMP/baseline-bench.test" ./benchmarks
          )
      - name: Run alternating samples
        run: |
          set -euo pipefail
          baseline_output="$RUNNER_TEMP/baseline-bench.txt"
          current_output="$RUNNER_TEMP/current-bench.txt"
          : > "$baseline_output"
          : > "$current_output"
          benchmark='^(BenchmarkParse|BenchmarkTranspile|BenchmarkFormat)$'
          run_one() {
            local binary=$1
            local output=$2
            GOMAXPROCS=1 taskset -c 0 "$binary" \
              -test.run '^$' -test.bench "$benchmark" -test.benchmem \
              -test.count=1 -test.benchtime=1s -test.cpu=1 >> "$output"
          }
          for sample in 1 2 3 4 5; do
            if (( sample % 2 )); then
              run_one "$RUNNER_TEMP/baseline-bench.test" "$baseline_output"
              run_one "$RUNNER_TEMP/current-bench.test" "$current_output"
            else
              run_one "$RUNNER_TEMP/current-bench.test" "$current_output"
              run_one "$RUNNER_TEMP/baseline-bench.test" "$baseline_output"
            fi
          done
      - name: Compare medians
        env:
          FAIL_REGRESSION_PERCENT: ${{ inputs.fail_regression_percent }}
        run: |
          set -euo pipefail
          python3 tools/compare_benchmarks.py \
            "$RUNNER_TEMP/baseline-bench.txt" \
            "$RUNNER_TEMP/current-bench.txt" \
            --output "$RUNNER_TEMP/benchmark-comparison.md" \
            --fail-regression-percent "$FAIL_REGRESSION_PERCENT"
          cat "$RUNNER_TEMP/benchmark-comparison.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Run deterministic corpus sample
        run: |
          set -euo pipefail
          GOMAXPROCS=1 taskset -c 0 "$RUNNER_TEMP/current-bench.test" \
            -test.run '^$' -test.bench '^BenchmarkCorpusTranspile$' \
            -test.benchmem -test.count=3 -test.benchtime=250ms -test.cpu=1 \
            > "$RUNNER_TEMP/corpus-bench.txt"
      - name: Upload Go revision results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: go-revision-comparison
          path: |
            ${{ runner.temp }}/baseline-bench.txt
            ${{ runner.temp }}/current-bench.txt
            ${{ runner.temp }}/benchmark-comparison.md
            ${{ runner.temp }}/corpus-bench.txt
          retention-days: 14

  polyglot-core:
    name: Fully optimized core comparison
    if: ${{ inputs.run_polyglot_core }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 180
    env:
      CARGO_BUILD_JOBS: "1"
      CARGO_INCREMENTAL: "0"
      GO_VERSION: 1.25.12
      POLYGLOT_REF: 44ab8f9473039f143a2907e0e64001606b3c05e4
      RUST_TOOLCHAIN: 1.97.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Select pinned Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --no-self-update
          rustup default "$RUST_TOOLCHAIN"
      - name: Record runner and toolchain
        env:
          RUNNER_LABEL: ${{ inputs.runner }}
        run: |
          set -euo pipefail
          {
            echo "golyglot_commit=$GITHUB_SHA"
            echo "runner=$RUNNER_LABEL"
            uname -a
            lscpu
            free -h
            df -h
            go version
            rustc --version --verbose
            cargo --version --verbose
          } | tee "$RUNNER_TEMP/environment.txt"
      - name: Check out pinned Polyglot
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/tobilg/polyglot.git .cache/polyglot
          git -C .cache/polyglot fetch --depth=1 origin "$POLYGLOT_REF"
          git -C .cache/polyglot checkout --detach FETCH_HEAD
          test "$(git -C .cache/polyglot rev-parse HEAD)" = "$POLYGLOT_REF"
      - name: Cache Cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: polyglot-core-registry-${{ env.RUST_TOOLCHAIN }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.cache/polyglot/Cargo.lock') }}
      - name: Verify optimized profile and install comparison runner
        run: |
          set -euo pipefail
          if env | grep -q '^CARGO_PROFILE_'; then
            echo "::error::CARGO_PROFILE overrides would invalidate the optimized comparison"
            env | grep '^CARGO_PROFILE_'
            exit 1
          fi
          python3 tools/verify_polyglot_bench_profile.py .cache/polyglot/Cargo.toml \
            | tee "$RUNNER_TEMP/polyglot-profile.json"
          install -D -m 0644 tools/polyglot_core_bench.rs \
            .cache/polyglot/crates/polyglot-sql/src/bin/golyglot_core_bench.rs
          git -C .cache/polyglot diff --exit-code
          test "$(git -C .cache/polyglot status --porcelain --untracked-files=all)" = \
            "?? crates/polyglot-sql/src/bin/golyglot_core_bench.rs"
          sha256sum tools/polyglot_core_bench.rs \
            .cache/polyglot/crates/polyglot-sql/src/bin/golyglot_core_bench.rs \
            | tee "$RUNNER_TEMP/runner-source-sha256.txt"
      - name: Fetch locked Rust dependencies
        run: |
          set -euo pipefail
          cargo fetch --manifest-path .cache/polyglot/Cargo.toml --locked
      - name: Add memory headroom for full LTO
        run: |
          set -euo pipefail
          memory_kib=$(awk '/MemTotal/ {print $2}' /proc/meminfo)
          if (( memory_kib < 25165824 )); then
            swap_path="$RUNNER_TEMP/polyglot-build.swap"
            available_kib=$(df --output=avail -k "$RUNNER_TEMP" | tail -n 1)
            if (( available_kib < 52428800 )); then
              echo "::error::need at least 50 GiB free for full-LTO build and swap headroom"
              exit 1
            fi
            sudo fallocate -l 24G "$swap_path"
            sudo chmod 600 "$swap_path"
            sudo mkswap "$swap_path"
            sudo swapon "$swap_path"
            echo "BUILD_SWAP_PATH=$swap_path" >> "$GITHUB_ENV"
          fi
          free -h
          swapon --show
      - name: Build equivalent optimized runners
        run: |
          set -euo pipefail
          CGO_ENABLED=0 go build -trimpath -ldflags='-s -w -buildid=' \
            -o "$RUNNER_TEMP/golyglot-core-bench" ./cmd/golyglot-core-bench
          set -o pipefail
          /usr/bin/time -v -o "$RUNNER_TEMP/polyglot-build-resources.txt" \
            cargo build --manifest-path .cache/polyglot/Cargo.toml \
              --profile bench --frozen -p polyglot-sql \
              --bin golyglot_core_bench \
            |& tee "$RUNNER_TEMP/polyglot-build.log"
          install -m 0755 \
            .cache/polyglot/target/release/golyglot_core_bench \
            "$RUNNER_TEMP/polyglot-core-bench"
          strip --strip-all "$RUNNER_TEMP/golyglot-core-bench"
          strip --strip-all "$RUNNER_TEMP/polyglot-core-bench"
          free -h
          swapon --show
      - name: Validate matched results
        run: |
          set -euo pipefail
          output_dir="$RUNNER_TEMP/core-correctness"
          mkdir -p "$output_dir"
          while IFS=$'\t' read -r operation case_name sql_name; do
            sql_path="benchmarks/core_cases/$sql_name"
            golyglot_output="$output_dir/$operation-$case_name.golyglot.txt"
            polyglot_output="$output_dir/$operation-$case_name.polyglot.txt"
            GOMAXPROCS=1 "$RUNNER_TEMP/golyglot-core-bench" \
              --mode result --operation "$operation" --case "$case_name" \
              --sql-file "$sql_path" > "$golyglot_output"
            "$RUNNER_TEMP/polyglot-core-bench" \
              --mode result --operation "$operation" --case "$case_name" \
              --sql-file "$sql_path" > "$polyglot_output"
            diff -u "$golyglot_output" "$polyglot_output"
          done < benchmarks/core_cases/cases.tsv
          sha256sum benchmarks/core_cases/*.sql | tee "$RUNNER_TEMP/core-input-sha256.txt"
      - name: Record stripped binary footprint
        run: |
          set -euo pipefail
          {
            stat --printf='%n\t%s bytes\n' \
              "$RUNNER_TEMP/golyglot-core-bench" \
              "$RUNNER_TEMP/polyglot-core-bench"
            sha256sum \
              "$RUNNER_TEMP/golyglot-core-bench" \
              "$RUNNER_TEMP/polyglot-core-bench"
            file \
              "$RUNNER_TEMP/golyglot-core-bench" \
              "$RUNNER_TEMP/polyglot-core-bench"
            size \
              "$RUNNER_TEMP/golyglot-core-bench" \
              "$RUNNER_TEMP/polyglot-core-bench"
            ldd "$RUNNER_TEMP/golyglot-core-bench" || true
            ldd "$RUNNER_TEMP/polyglot-core-bench" || true
          } | tee "$RUNNER_TEMP/binary-footprint.txt"
      - name: Run balanced paired samples
        env:
          CORE_DURATION_MS: ${{ inputs.core_duration_ms }}
          CORE_SAMPLES: ${{ inputs.core_samples }}
        run: |
          set -euo pipefail
          if ! [[ "$CORE_SAMPLES" =~ ^[0-9]+$ ]] || (( CORE_SAMPLES < 5 || CORE_SAMPLES > 30 )); then
            echo "::error::core_samples must be an integer from 5 through 30"
            exit 1
          fi
          if ! [[ "$CORE_DURATION_MS" =~ ^[0-9]+$ ]] || (( CORE_DURATION_MS < 100 || CORE_DURATION_MS > 5000 )); then
            echo "::error::core_duration_ms must be an integer from 100 through 5000"
            exit 1
          fi
          golyglot_output="$RUNNER_TEMP/golyglot-core.tsv"
          polyglot_output="$RUNNER_TEMP/polyglot-core.tsv"
          : > "$golyglot_output"
          : > "$polyglot_output"
          run_golyglot() {
            local sample=$1 operation=$2 case_name=$3 sql_path=$4
            taskset -c 0 env GOMAXPROCS=1 "$RUNNER_TEMP/golyglot-core-bench" \
              --sample "$sample" --operation "$operation" --case "$case_name" \
              --sql-file "$sql_path" --warmup 250ms \
              --duration "${CORE_DURATION_MS}ms" >> "$golyglot_output"
          }
          run_polyglot() {
            local sample=$1 operation=$2 case_name=$3 sql_path=$4
            taskset -c 0 "$RUNNER_TEMP/polyglot-core-bench" \
              --sample "$sample" --operation "$operation" --case "$case_name" \
              --sql-file "$sql_path" --warmup-ms 250 \
              --duration-ms "$CORE_DURATION_MS" >> "$polyglot_output"
          }
          for (( sample = 1; sample <= CORE_SAMPLES; sample++ )); do
            case_index=0
            while IFS=$'\t' read -r operation case_name sql_name; do
              sql_path="benchmarks/core_cases/$sql_name"
              echo "sample $sample/$CORE_SAMPLES: $operation/$case_name"
              if (( (sample + case_index) % 2 )); then
                run_golyglot "$sample" "$operation" "$case_name" "$sql_path"
                run_polyglot "$sample" "$operation" "$case_name" "$sql_path"
              else
                run_polyglot "$sample" "$operation" "$case_name" "$sql_path"
                run_golyglot "$sample" "$operation" "$case_name" "$sql_path"
              fi
              case_index=$((case_index + 1))
            done < benchmarks/core_cases/cases.tsv
          done
      - name: Compare optimized cores
        env:
          CORE_SAMPLES: ${{ inputs.core_samples }}
        run: |
          set -euo pipefail
          python3 tools/compare_core_benchmarks.py \
            "$RUNNER_TEMP/golyglot-core.tsv" \
            "$RUNNER_TEMP/polyglot-core.tsv" \
            --golyglot-binary "$RUNNER_TEMP/golyglot-core-bench" \
            --polyglot-binary "$RUNNER_TEMP/polyglot-core-bench" \
            --minimum-samples "$CORE_SAMPLES" \
            --fail-if-golyglot-parse-slower \
            --output "$RUNNER_TEMP/core-comparison.md"
          {
            echo "# Fully optimized Golyglot / Polyglot comparison"
            echo
            echo "- Golyglot: \`$GITHUB_SHA\`"
            echo "- Polyglot: \`$POLYGLOT_REF\`"
            echo "- Polyglot profile: \`bench\`, opt-level 3, LTO enabled, one codegen unit"
            echo "- Same runner and CPU; paired order alternates for every case and sample"
            echo
            cat "$RUNNER_TEMP/core-comparison.md"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload optimized comparison evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: optimized-core-comparison
          path: |
            ${{ runner.temp }}/environment.txt
            ${{ runner.temp }}/polyglot-profile.json
            ${{ runner.temp }}/runner-source-sha256.txt
            ${{ runner.temp }}/polyglot-build.log
            ${{ runner.temp }}/polyglot-build-resources.txt
            ${{ runner.temp }}/core-correctness
            ${{ runner.temp }}/core-input-sha256.txt
            ${{ runner.temp }}/binary-footprint.txt
            ${{ runner.temp }}/golyglot-core.tsv
            ${{ runner.temp }}/polyglot-core.tsv
            ${{ runner.temp }}/core-comparison.md
          if-no-files-found: warn
          retention-days: 14
